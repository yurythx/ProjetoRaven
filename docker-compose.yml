services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projeto_raven
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  django:
    build:
      context: ./Backend
      target: development
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      USE_SQLITE: "False"
      ALLOWED_HOSTS: "*"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CHANNEL_LAYER_URL: redis://redis:6379/3
      CORS_ALLOWED_ORIGINS: "http://localhost:3006,http://127.0.0.1:3006"
    volumes:
      - ./Backend:/app
      - media_files:/app/mediafiles
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             python manage.py runserver 0.0.0.0:8000"

  scheduler:
    build:
      context: ./Backend
      target: development
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      USE_SQLITE: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./Backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "while true; do python manage.py publish_scheduled; sleep 60; done"

  frontend:
    build:
      context: ./frontend
      target: deps
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8006
      NEXT_PUBLIC_SITE_URL: http://localhost:3006
      INTERNAL_API_BASE_URL: http://django:8000
      NODE_OPTIONS: --max-old-space-size=2048
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3006:3000"
    depends_on:
      - django
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  media_files:
