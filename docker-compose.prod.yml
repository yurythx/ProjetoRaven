# Production compose — use com:
#   docker compose -f docker-compose.prod.yml up -d
#
# O Cloudflare Tunnel já roda no servidor como container separado.
# Basta configurar as rotas no painel do Cloudflare apontando para:
#
#   yourdomain.com        →  http://localhost:3100   (Next.js frontend)
#   yourdomain.com/api/   →  http://localhost:8100   (Django — opcional)
#   yourdomain.com/ws/    →  http://localhost:8100   (Django WebSocket — necessário
#                                                      para o fórum em tempo real)
#
# Portas configuráveis via Backend/.env.prod:
#   FRONTEND_PORT=3100   (padrão — ajuste se já houver algo nessa porta)
#   DJANGO_PORT=8100     (padrão — ajuste se já houver algo nessa porta)
#
# Nenhum outro serviço expõe porta no host (postgres, redis ficam isolados).
# O nome "projetoraven" isola containers, redes e volumes do app existente.
#
# Requisitos antes do primeiro deploy:
#   1. cp Backend/.env.prod.example  Backend/.env.prod  (preencher todos os valores)
#   2. cp frontend/.env.prod.example frontend/.env.prod
#   3. Gerar chaves JWT RSA (uma única vez no servidor):
#        mkdir -p Backend/keys
#        openssl genrsa -out Backend/keys/private.pem 2048
#        openssl rsa -in Backend/keys/private.pem -pubout -out Backend/keys/public.pem
#      As chaves ficam em Backend/keys/ (já no .gitignore via *.pem)

name: projetoraven

services:
  # ── Data layer (somente rede interna) ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./Backend/.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projeto_raven}
      POSTGRES_USER: ${POSTGRES_USER:-raven}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raven} -d ${POSTGRES_DB:-projeto_raven}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ./Backend/.env.prod
    command: >
      sh -c "redis-server --requirepass $$REDIS_PASSWORD --maxmemory 256mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────────────────────
  django:
    build:
      context: ./Backend
      target: production
    restart: unless-stopped
    env_file: ./Backend/.env.prod
    environment:
      USE_SQLITE: "False"
      POSTGRES_HOST: postgres
    volumes:
      - media_files:/app/mediafiles
      - static_files:/app/staticfiles
      - ./Backend/keys:/app/keys
    ports:
      # Exposto apenas para o cloudflared rotear /api/ diretamente (opcional)
      - "127.0.0.1:${DJANGO_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/ready/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "mkdir -p /app/keys &&
             ([ -f /app/keys/private.pem ] || (openssl genrsa -out /app/keys/private.pem 2048 &&
             openssl rsa -in /app/keys/private.pem -pubout -out /app/keys/public.pem)) &&
             python manage.py bootstrap_prod &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"

  # ── Frontend (exposto ao cloudflared via host) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://projetoraven.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://projetoraven.com}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-wss://ws.projetoraven.com}
    restart: unless-stopped
    env_file: ./frontend/.env.prod
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://django:8000
    ports:
      # O cloudflared roteia yourdomain.com → http://localhost:3100
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    depends_on:
      - django
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=http.request({host:'127.0.0.1',port:3000,path:'/',timeout:4000},res=>process.exit(res.statusCode?0:1));req.on('error',()=>process.exit(1));req.on('timeout',()=>{req.destroy();process.exit(1)});req.end();"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
