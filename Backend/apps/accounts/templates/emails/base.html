<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}Raven Universe{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0a0f; font-family: 'Segoe UI', Arial, sans-serif; color: #c8c8d4; }
    .wrapper { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
    .card { background: #13131a; border: 1px solid #2a2a3a; border-radius: 16px; overflow: hidden; }
    .header { background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%); padding: 36px 40px; text-align: center; }
    .logo { display: inline-block; width: 56px; height: 56px; background: rgba(255,255,255,0.15); border-radius: 14px; line-height: 56px; font-size: 28px; font-weight: 900; color: #fff; letter-spacing: -1px; }
    .logo-label { display: block; margin-top: 10px; color: rgba(255,255,255,0.8); font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; }
    .body { padding: 36px 40px; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; color: #f0f0f8; }
    p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #9898b0; }
    .code-box { background: #0d0d14; border: 1px solid #7c3aed55; border-radius: 12px; padding: 20px; text-align: center; margin: 24px 0; }
    .code { font-size: 36px; font-weight: 900; letter-spacing: 10px; color: #a78bfa; font-family: 'Courier New', monospace; }
    .code-hint { font-size: 12px; color: #5a5a70; margin-top: 8px; }
    .btn { display: inline-block; background: linear-gradient(135deg, #7c3aed, #06b6d4); color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; }
    .btn-wrap { text-align: center; margin: 28px 0; }
    .divider { height: 1px; background: #2a2a3a; margin: 28px 0; }
    .footer { padding: 24px 40px; text-align: center; font-size: 12px; color: #3a3a50; }
    .highlight { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <div class="logo">R</div>
        <span class="logo-label">Raven Universe</span>
      </div>
      <div class="body">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p>Raven Universe &mdash; O Mundo que Nunca Dorme</p>
        <p>Você está recebendo este e-mail porque tem uma conta em Raven Universe.<br>
        Se não reconhece esta ação, ignore este e-mail.</p>
      </div>
    </div>
  </div>
</body>
</html>
