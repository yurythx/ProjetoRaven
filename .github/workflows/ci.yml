name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest ───────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: test_projeto_raven
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production-at-least-50-chars-long
      DEBUG: "True"
      USE_SQLITE: "False"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_projeto_raven
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/2
      CHANNEL_LAYER_URL: redis://localhost:6379/3
      ALLOWED_HOSTS: "*"
      EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt

      - name: Lint (report-only)
        # Codebase has pre-existing findings (mostly unused imports) never gated before.
        # Non-blocking until that backlog is cleaned up; still surfaces new issues in PR diffs.
        continue-on-error: true
        run: pip install ruff && ruff check .

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest --tb=short -q

  # ── Frontend: type-check + build ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8006
          SKIP_ENV_VALIDATION: "true"
        run: npm run build

  # ── Docker: build + vulnerability/secret scan (report-only) ────────────────────
  # Non-blocking: current findings are all upstream (unfixed Debian/kernel CVEs,
  # Next.js's internally-vendored deps) with no actionable fix on our side yet.
  # Still worth running — this exact scan is what caught a real JWT private key
  # baked into the backend image, which the audit-only checks above could not.
  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --target production -t projetoraven-backend:ci ./Backend

      - name: Build frontend image
        run: |
          docker build --target runner -t projetoraven-frontend:ci \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8006 \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3006 \
            --build-arg NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8006 \
            ./frontend

      - name: Scan backend image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projetoraven-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projetoraven-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan backend image for leaked secrets (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projetoraven-backend:ci
          scanners: secret
          exit-code: "1"

      - name: Scan frontend image for leaked secrets (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projetoraven-frontend:ci
          scanners: secret
          exit-code: "1"

  # ── E2E: Playwright ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Start services
        run: docker compose up -d --wait postgres redis django
        env:
          COMPOSE_FILE: docker-compose.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8006
        run: npm run build

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_TARGET: docker
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
