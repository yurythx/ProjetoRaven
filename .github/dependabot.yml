version: 2

updates:
  # Python / pip (Django backend)
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      # Major Django upgrades should be intentional
      - dependency-name: Django
        update-types: ["version-update:semver-major"]

  # npm (Next.js frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      # Major Next.js upgrades should be intentional
      - dependency-name: next
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
